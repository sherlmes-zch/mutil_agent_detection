[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mutil-agent-detection"
version = "0.1.0"
description = "Protocol models for multi-agent vulnerability auditing"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0,<3.0",
    "langgraph>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
primevul-audit = "mutil_agent_detection.cli:main"
